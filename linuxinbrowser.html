<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>In-Browser Linux Terminal (v86)</title>
    <!-- Load v86 engine directly from CDN -->
    <script src="https://cdn.jsdelivr.net/npm/v86@latest/build/v86_all.js"></script>
    <style>
        :root {
            --bg-color: #0d1117;
            --panel-bg: #161b22;
            --text-color: #c9d1d9;
            --border-color: #30363d;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        h1 {
            margin-bottom: 5px;
            font-size: 1.6rem;
        }

        p.subtitle {
            color: #8b949e;
            margin-top: 0;
            margin-bottom: 20px;
        }

        #terminal-card {
            background-color: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        #screen_container {
            width: 720px;
            height: 440px;
            background-color: #000000;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            overflow-y: auto;
            padding: 10px;
            box-sizing: border-box;
        }

        #screen {
            white-space: pre-wrap;
            word-break: break-all;
            font-family: 'Courier New', Courier, monospace;
            font-size: 14px;
            line-height: 16px;
            color: #00ff00;
        }

        #status {
            margin-top: 10px;
            font-size: 0.9rem;
            color: #58a6ff;
            font-family: monospace;
        }
    </style>
</head>
<body>

    <h1>WebAssembly Linux Environment</h1>
    <p class="subtitle">Standard x86 Linux Kernel ISO running live in WebAssembly</p>

    <div id="terminal-card">
        <div id="screen_container">
            <div id="screen"></div>
        </div>
        <div id="status">Initializing WebAssembly virtual machine...</div>
    </div>

    <script>
        const statusDiv = document.getElementById('status');
        const screenDiv = document.getElementById('screen');

        window.addEventListener('load', () => {
            if (typeof V86Starter === 'undefined') {
                statusDiv.textContent = 'Error: v86 library failed to load.';
                statusDiv.style.color = '#f85149';
                return;
            }

            statusDiv.textContent = 'Booting x86 Linux ISO...';

            const emulator = new V86Starter({
                wasm_path: "https://cdn.jsdelivr.net/npm/v86@latest/build/v86.wasm",
                memory_size: 256 * 1024 * 1024,
                vga_memory_size: 8 * 1024 * 1024,
                screen_container: document.getElementById("screen_container"),
                bios: { url: "https://cdn.jsdelivr.net/npm/v86@latest/bios/seabios.bin" },
                vga_bios: { url: "https://cdn.jsdelivr.net/npm/v86@latest/bios/vgabios.bin" },
                cdrom: { url: "https://copy.sh/v86/images/buildroot-bzimage.iso" },
                autostart: true
            });

            // Redirect serial console character stream straight into the screen container
            emulator.add_listener("serial0-output-char", function(char) {
                screenDiv.textContent += char;
                const container = document.getElementById("screen_container");
                container.scrollTop = container.scrollHeight;
            });

            emulator.add_listener("emulator-ready", function() {
                statusDiv.textContent = 'System live! Click inside terminal to type.';
                statusDiv.style.color = '#3fb950';
            });
        });
    </script>
</body>
</html>
